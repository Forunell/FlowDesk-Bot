{% extends "base.html" %}
{% block title %}Нова заявка — FlowDesk{% endblock %}
{% block breadcrumb %}<a href="/admin">Заявки</a> / Нова заявка{% endblock %}
{% block content %}<a href="/admin" class="back-link">← До всіх заявок</a><section class="ws-heading"><div><h1>Нова заявка</h1><p>Локальне демо · використовуйте вигадані контакти.</p></div></section><form class="surface new-form padded" method="post" action="/admin/new"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="nonce" value="{{ nonce }}"><label>Тема<input name="title" required minlength="3" maxlength="120" placeholder="Коротко опишіть проблему"></label><div class="form-pair"><label>Ім’я заявника<input name="name" required minlength="2" maxlength="80"></label><label>Контакт<input name="contact" required maxlength="254" placeholder="demo@example.com"></label></div><div class="form-pair"><label>Категорія<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Пріоритет<select name="priority">{% for k,v in priorities.items() %}<option value="{{ k }}" {% if k == 'medium' %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></label></div><label>Опис<textarea name="description" rows="5" required minlength="10" maxlength="2000"></textarea></label><button class="primary">Створити заявку</button></form>{% endblock %}
